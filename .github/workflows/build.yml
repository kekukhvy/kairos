name: Build

# Verifies that every change compiles and its tests pass, across all modules.
# Runs on pull requests into the long-lived branches, and on pushes to them so
# the branch itself always has a known-good status (a PR can go stale between
# its last CI run and the merge).
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

# Read-only: this workflow builds and tests, it never publishes.
# Image publishing lives in release-admin.yml.
permissions:
  contents: read

# A new push to the same branch/PR makes the in-flight run obsolete — cancel it
# rather than paying for a result nobody will read. Never cancels on the
# protected branches, where each commit's status is the record.
concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # JDK 26 matches javaToolchainVersion in gradle.properties. Providing it
      # here means Gradle uses this JDK directly instead of provisioning its own.
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          java-version: '26'
          distribution: 'temurin'

      # Caches ~/.gradle (dependencies + wrapper) keyed on the build files, and
      # writes the cache only from the default branch so PR runs read a shared,
      # stable cache instead of each seeding its own.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' }}

      # `build` compiles every module in settings.gradle and runs its tests.
      # No daemon: the runner is single-use, so a background daemon only adds
      # startup cost. No JOOQ codegen is involved — the generated sources are
      # committed, so this needs no database.
      - name: Build and test
        run: ./gradlew --no-daemon build

      # Test reports are what you actually want when the step above goes red,
      # so upload them on failure. Without this the logs are the only evidence.
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: '**/build/reports/tests/'
          retention-days: 7
          if-no-files-found: ignore
