name: Release kairos-admin

# On every push to main, release-please reads the Conventional Commits since the
# last release and maintains a "Release PR" that bumps kairos-admin's version and
# CHANGELOG. When that Release PR is merged, release-please creates a GitHub
# Release + tag — and this same workflow then builds the Docker image tagged with
# that version and pushes it to GHCR.
on:
  push:
    branches: [main]
  # Manual trigger to (re)build and push the image without cutting a new release
  # — e.g. when a release was tagged but its image build failed. Builds from the
  # current main and tags with the given version (defaults to version.txt).
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to build/push (blank = kairos-admin/version.txt)"
        required: false
        default: ""

# Least-privilege token: contents for tags/releases, packages to push to GHCR,
# PRs so release-please can open its Release PR.
permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    # Only the push flow cuts releases; manual dispatch just rebuilds the image.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      # True only on the run where the kairos-admin Release PR was merged.
      released: ${{ steps.rp.outputs['kairos-admin--release_created'] }}
      version: ${{ steps.rp.outputs['kairos-admin--version'] }}
      tag: ${{ steps.rp.outputs['kairos-admin--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: rp
        with:
          # Uses release-please-config.json + .release-please-manifest.json.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Release from main. The repo's default branch is `develop`, so without
          # this release-please would target develop instead of the release line.
          target-branch: main

  build-image:
    needs: release-please
    # Build when a release was cut (push flow) OR when triggered manually.
    # `always()` so a skipped release-please job (manual dispatch) doesn't block this.
    if: ${{ always() && (needs.release-please.outputs.released == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/kairos-admin
    steps:
      - uses: actions/checkout@v4

      # Resolve the version: release output → manual input → version.txt.
      - name: Resolve version
        id: ver
        run: |
          V="${{ needs.release-please.outputs.version }}"
          [ -z "$V" ] && V="${{ github.event.inputs.version }}"
          [ -z "$V" ] && V="$(tr -d ' \n' < kairos-admin/version.txt)"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Building image version: $V"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: kairos-admin/Dockerfile
          push: true
          build-args: |
            KAIROS_ADMIN_VERSION=${{ steps.ver.outputs.version }}
          # Tag both the exact version and a moving :latest.
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          echo "### Pushed \`${IMAGE}:${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Run it locally:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "docker run --rm -p 8080:8080 ${IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
