plugins {
    id 'java'
}

group = 'dev.kairos'
version = '0.1.0-SNAPSHOT'

ext {
    javaToolchainVersion = 26

    junitBomVersion = '5.11.4'
    testcontainersBomVersion = '1.20.4'
    flywayVersion = '12.9.0'
    postgresDriverVersion = '42.7.11'
    hikariVersion = '7.1.0'
}

subprojects {
    apply plugin: 'java'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(javaToolchainVersion)
        }
    }

    repositories {
        mavenCentral()
    }
}
