spring.application.name=kairos-admin

# Admin UI runs on its own port; kairos-api stays on its own
server.port=8090

# Base URL of the Kairos REST API (Javalin).
kairos.api.base-url=http://localhost:8080
kairos.api.task-endpoint=/api/v1/tasks
kairos.api.destination-endpoint=/api/v1/destinations
kairos.api.schedule-endpoint=/api/v1/schedules

# Fail fast instead of blocking the UI thread when kairos-api is slow/down.
kairos.api.connect-timeout=5s
kairos.api.read-timeout=10s

# Vaadin dev convenience
vaadin.launch-browser=true

# Seed demo tasks/schedules into kairos-api on startup (off by default).
# Set to true to populate the UI with representative sample data.
kairos.demo.seed=true

# Logging
logging.level.dev.kairos.admin=INFO
logging.level.org.atmosphere=WARN

