plugins {
    id 'application'
}

description = 'Kairos scheduler engine: planner, claim loop, retry — owns the database schema'

application {
    mainClass = 'dev.kairos.engine.KairosEngine'
}

dependencies {
    implementation project(':kairos-persistence')

    implementation "org.slf4j:slf4j-api:${slf4jVersion}"
    runtimeOnly "ch.qos.logback:logback-classic:${logbackVersion}"

    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // Domain types (Schedule, ScheduleType) are referenced only by tests today —
    // the planner and claim loop land in M5/M6. Promote to `implementation` when
    // the engine's main source set actually uses them.
    testImplementation project(':kairos-core')
    // H2DatabaseBase (in-process H2, PostgreSQL mode) for repository-style ITs —
    // brings JUnit + H2 transitively.
    testImplementation testFixtures(project(':kairos-persistence'))
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}
