# Database
db.url=jdbc:postgresql://localhost:5432/kairos
db.username=kairos
db.password=kairos
db.pool.size=10

# Flyway
flyway.locations=classpath:db/migration
flyway.baseline-on-migrate=false

#server
# Unused by the engine today (no HTTP server) — kept because kairos-engine
# reuses AppConfig wholesale rather than a per-component config split
# (deliberately deferred, see doc/specs/persistence-module.md).
server.port=8080

# Engine health signal — file-based marker, see EngineHealth. Written only
# after Flyway completes; orchestration probes for its existence.
engine.health.file=/tmp/kairos-engine/engine.health
