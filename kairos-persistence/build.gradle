plugins {
    id 'nu.studer.jooq'  // version pinned in pluginManagement (settings.gradle)
}

description = 'Kairos persistence: datasource, Flyway migrations, JOOQ codegen — shared by every component that talks to the database'

// ── jOOQ codegen DB connection ─────────────────────────────────────────────────
// Resolution order: env var -> local.properties (gitignored) -> hardcoded local default.
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def jooqDbUrl      = System.getenv('DB_URL')      ?: localProps.getProperty('db.url')      ?: 'jdbc:postgresql://localhost:5432/kairos'
def jooqDbUser     = System.getenv('DB_USERNAME')  ?: localProps.getProperty('db.username') ?: 'kairos'
def jooqDbPassword = System.getenv('DB_PASSWORD')  ?: localProps.getProperty('db.password') ?: 'kairos'

// ── Dependencies ───────────────────────────────────────────────────────────────
// Exposed as `api`: every consumer (kairos-api, kairos-engine, ...) needs the
// DataSource/DSLContext/Flyway types on its own compile classpath, not just at
// runtime.
dependencies {
    api "com.zaxxer:HikariCP:${hikariVersion}"

    api "org.flywaydb:flyway-core:${flywayVersion}"
    api "org.flywaydb:flyway-database-postgresql:${flywayVersion}"
    api "org.postgresql:postgresql:${postgresDriverVersion}"

    api "org.jooq:jooq:${jooqVersion}"

    api "org.slf4j:slf4j-api:${slf4jVersion}"

    jooqGenerator "org.postgresql:postgresql:${postgresDriverVersion}"

    testImplementation platform("org.junit:junit-bom:${junitBomVersion}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation "com.h2database:h2:${h2Version}"

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ── jOOQ codegen ──────────────────────────────────────────────────────────────
jooq {
    version = "${jooqVersion}"

    configurations {
        main {
            generationTool {
                jdbc {
                    driver   = 'org.postgresql.Driver'
                    url      = jooqDbUrl
                    user     = jooqDbUser
                    password = jooqDbPassword
                }
                generator {
                    name = 'org.jooq.codegen.DefaultGenerator'

                    database {
                        name        = 'org.jooq.meta.postgres.PostgresDatabase'
                        inputSchema = 'public'
                        includes    = 'destinations|tasks|retry_policies|schedules|executions|execution_history'
                        excludes    = 'flyway_schema_history'
                        // No forcedTypes for JSONB — columns stay as org.jooq.JSONB.
                        // Conversion to/from String is handled in TaskMapper via
                        // JSONB.valueOf(string) and jsonb.data().
                    }

                    generate {
                        daos           = false
                        records        = true
                        pojos          = false
                        immutablePojos = false
                        fluentSetters  = true
                        javaTimeTypes  = true
                    }

                    target {
                        // Kept as dev.kairos.infrastructure.generated (not
                        // dev.kairos.persistence.generated) so every repository
                        // that already imports these types across the codebase
                        // needs no import rewrite after the module move.
                        packageName = 'dev.kairos.infrastructure.generated'
                        directory   = 'src/main/generated'
                    }
                }
            }
        }
    }
}

sourceSets.main.java.srcDirs += ['src/main/generated']

test {
    useJUnitPlatform()
}
